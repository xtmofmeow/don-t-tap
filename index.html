<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DON'T TAP</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  overflow: hidden;
  background: #fff4f8;
  color: #4a3440;
  font-family: Arial, sans-serif;
  user-select: none;
  -webkit-user-select: none;
}

#game {
  width: 100vw;
  height: 100vh;
  position: relative;
  overflow: hidden;
}

#score {
  position: absolute;
  top: 24px;
  width: 100%;
  text-align: center;
  font-size: 24px;
  font-weight: bold;
  z-index: 10;
}

#timer {
  position: absolute;
  top: 58px;
  width: 100%;
  text-align: center;
  color: #9a7b87;
  z-index: 10;
}

#level {
  position: absolute;
  top: 82px;
  width: 100%;
  text-align: center;
  font-size: 12px;
  color: #b85c7a;
  z-index: 10;
}

#warning {
  position: absolute;
  top: 108px;
  width: 100%;
  text-align: center;
  color: #b85c7a;
  font-size: 12px;
  opacity: 0;
  z-index: 10;
}

#tapButton {
  position: absolute;
  width: 120px;
  height: 120px;
  border: none;
  border-radius: 50%;
  background: #f3c1d4;
  color: #4a3440;
  font-size: 18px;
  font-weight: bold;
  transform: translate(-50%, -50%);
  cursor: pointer;
  z-index: 5;

  box-shadow:
    0 8px 25px rgba(184,92,122,0.18);

  transition:
    left 0.15s ease,
    top 0.15s ease,
    width 0.2s ease,
    height 0.2s ease;
}

#tapButton:active {
  transform: translate(-50%, -50%) scale(0.88);
}

.trap {
  position: absolute;
  width: 90px;
  height: 90px;
  border: none;
  border-radius: 50%;
  background: #d88fa8;
  color: white;
  font-size: 15px;
  font-weight: bold;
  transform: translate(-50%, -50%);
  z-index: 4;
  cursor: pointer;
}

.rabbit {
  position: absolute;
  font-size: 48px;
  width: 65px;
  height: 65px;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 6;
  cursor: pointer;

  filter:
    drop-shadow(0 6px 8px rgba(184,92,122,0.18));

  transition: transform 0.12s ease;
}

.rabbit.jump {
  animation: rabbitJump 0.55s ease-out;
}

@keyframes rabbitJump {

  0% {
    transform: translateY(0) rotate(0deg);
  }

  35% {
    transform: translateY(-75px) rotate(-8deg);
  }

  65% {
    transform: translateY(-45px) rotate(8deg);
  }

  100% {
    transform: translateY(0) rotate(0deg);
  }

}

#levelFlash {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(
      circle at center,
      rgba(255,255,255,0.95),
      rgba(243,193,212,0.7),
      rgba(233,169,194,0)
    );

  opacity: 0;
  pointer-events: none;
  z-index: 15;
}

.levelFlashAnimation {
  animation: levelFlash 0.75s ease-out;
}

@keyframes levelFlash {

  0% {
    opacity: 0;
  }

  20% {
    opacity: 1;
  }

  45% {
    opacity: 0.8;
  }

  100% {
    opacity: 0;
  }

}

#levelMessage {
  position: absolute;
  top: 42%;
  width: 100%;
  text-align: center;
  font-size: 34px;
  font-weight: bold;
  color: #b85c7a;
  opacity: 0;
  pointer-events: none;
  z-index: 16;
}

.levelMessageAnimation {
  animation: levelMessage 0.9s ease-out;
}

@keyframes levelMessage {

  0% {
    opacity: 0;
    transform: scale(0.7);
  }

  30% {
    opacity: 1;
    transform: scale(1.1);
  }

  70% {
    opacity: 1;
    transform: scale(1);
  }

  100% {
    opacity: 0;
    transform: scale(1.05);
  }

}

.screen {
  position: absolute;
  inset: 0;
  background: #fff4f8;

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;

  text-align: center;
  z-index: 20;
}

.hidden {
  display: none !important;
}

h1 {
  margin: 0 0 12px;
  font-size: 48px;
  letter-spacing: 3px;
}

.subtitle {
  color: #9a7b87;
  margin-bottom: 30px;
}

.startButton {
  border: none;
  padding: 15px 36px;
  border-radius: 30px;

  background: #e9a9c2;
  color: #4a3440;

  font-size: 17px;
  font-weight: bold;

  cursor: pointer;

  box-shadow:
    0 6px 18px rgba(184,92,122,0.15);
}

.startButton:active {
  transform: scale(0.95);
}

#bestScore {
  color: #9a7b87;
  margin-bottom: 28px;
}

</style>
</head>

<body>

<div id="game">

  <div id="score">Score: 0</div>
  <div id="timer">3.0</div>
  <div id="level">LEVEL 1</div>

  <div id="warning">
    BE CAREFUL...
  </div>

  <div id="levelFlash"></div>

  <div id="levelMessage">
    LEVEL UP!
  </div>

  <button id="tapButton">
    TAP
  </button>

  <div id="startScreen" class="screen">

    <h1>DON'T TAP</h1>

    <div class="subtitle">
      Tap before time runs out.
    </div>

    <button class="startButton"
            onclick="startGame()">
      START
    </button>

  </div>

  <div id="gameOverScreen"
       class="screen hidden">

    <h1>GAME OVER</h1>

    <div id="finalScore"></div>

    <div id="bestScore"></div>

    <button class="startButton"
            onclick="startGame()">
      PLAY AGAIN
    </button>

  </div>

</div>

<script>

let score = 0;
let timeLeft = 3;

let timerInterval;
let rabbitInterval;

let gameRunning = false;

let traps = [];
let rabbits = [];

let currentLevel = 1;

let audioContext;


/* -------------------------
   AUDIO
------------------------- */

function initAudio() {

  if (!audioContext) {
    audioContext =
      new (window.AudioContext ||
      window.webkitAudioContext)();
  }

  if (audioContext.state === "suspended") {
    audioContext.resume();
  }
}


function playTone(
  frequency,
  duration,
  type = "sine",
  volume = 0.06
) {

  initAudio();

  const oscillator =
    audioContext.createOscillator();

  const gain =
    audioContext.createGain();

  oscillator.type = type;

  oscillator.frequency.value =
    frequency;

  gain.gain.setValueAtTime(
    volume,
    audioContext.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    0.001,
    audioContext.currentTime + duration
  );

  oscillator.connect(gain);
  gain.connect(audioContext.destination);

  oscillator.start();

  oscillator.stop(
    audioContext.currentTime + duration
  );
}


function tapSound() {

  playTone(
    620,
    0.07,
    "sine",
    0.055
  );

}


function rabbitSound() {

  playTone(
    180,
    0.08,
    "triangle",
    0.04
  );

  setTimeout(() => {

    playTone(
      300,
      0.1,
      "triangle",
      0.035
    );

  }, 50);

}


function levelUpSound() {

  playTone(
    523,
    0.12,
    "sine",
    0.06
  );

  setTimeout(() => {

    playTone(
      659,
      0.12,
      "sine",
      0.06
    );

  }, 100);

  setTimeout(() => {

    playTone(
      784,
      0.2,
      "sine",
      0.065
    );

  }, 200);

}


/* -------------------------
   ELEMENTS
------------------------- */

const button =
  document.getElementById("tapButton");

const scoreText =
  document.getElementById("score");

const timerText =
  document.getElementById("timer");

const levelText =
  document.getElementById("level");

const warning =
  document.getElementById("warning");

const levelFlash =
  document.getElementById("levelFlash");

const levelMessage =
  document.getElementById("levelMessage");

const startScreen =
  document.getElementById("startScreen");

const gameOverScreen =
  document.getElementById("gameOverScreen");

const finalScore =
  document.getElementById("finalScore");

const bestScore =
  document.getElementById("bestScore");


button.style.display = "none";


/* -------------------------
   START
------------------------- */

function startGame() {

  initAudio();

  score = 0;
  timeLeft = 3;
  currentLevel = 1;

  gameRunning = true;

  clearInterval(timerInterval);
  clearInterval(rabbitInterval);

  removeTraps();
  removeRabbits();

  scoreText.textContent =
    "Score: 0";

  timerText.textContent =
    "3.0";

  levelText.textContent =
    "LEVEL 1";

  warning.style.opacity =
    "0";

  startScreen.classList.add(
    "hidden"
  );

  gameOverScreen.classList.add(
    "hidden"
  );

  button.style.display =
    "block";

  button.style.width =
    "120px";

  button.style.height =
    "120px";

  moveButton();

  timerInterval =
    setInterval(
      updateTimer,
      100
    );

}


/* -------------------------
   TIMER
------------------------- */

function updateTimer() {

  timeLeft -= 0.1;

  timerText.textContent =
    timeLeft.toFixed(1);

  if (timeLeft <= 0) {

    endGame();

  }

}


/* -------------------------
   CORRECT TAP
------------------------- */

function tapCorrectButton() {

  if (!gameRunning)
    return;

  score++;

  scoreText.textContent =
    "Score: " + score;

  tapSound();

  updateDifficulty();

  removeTraps();

  moveButton();

}


/* -------------------------
   DIFFICULTY
------------------------- */

function updateDifficulty() {

  let newLevel;

  let size;

  if (score < 10) {

    timeLeft = 3;
    size = 120;
    newLevel = 1;

  }

  else if (score < 20) {

    timeLeft = 2.3;
    size = 105;
    newLevel = 2;

  }

  else if (score < 30) {

    timeLeft = 1.8;
    size = 92;
    newLevel = 3;

  }

  else if (score < 40) {

    timeLeft = 1.3;
    size = 78;
    newLevel = 4;

  }

  else if (score < 60) {

    timeLeft = 1.0;
    size = 68;
    newLevel = 5;

  }

  else {

    timeLeft = 0.75;
    size = 58;
    newLevel = 6;

  }


  button.style.width =
    size + "px";

  button.style.height =
    size + "px";


  if (newLevel !== currentLevel) {

    currentLevel =
      newLevel;

    levelText.textContent =
      "LEVEL " + currentLevel;

    levelUp();

  }


  if (score >= 20) {

    warning.style.opacity =
      "1";

  }

}


/* -------------------------
   LEVEL UP
------------------------- */

function levelUp() {

  levelUpSound();

  levelFlash.classList.remove(
    "levelFlashAnimation"
  );

  levelMessage.classList.remove(
    "levelMessageAnimation"
  );

  void levelFlash.offsetWidth;

  levelFlash.classList.add(
    "levelFlashAnimation"
  );

  levelMessage.textContent =
    "LEVEL " + currentLevel;

  levelMessage.classList.add(
    "levelMessageAnimation"
  );


  /* Rabbit system */

  if (currentLevel >= 2) {

    createRabbits();

  }

}


/* -------------------------
   BUTTON MOVEMENT
------------------------- */

function moveButton() {

  const margin = 70;

  const x =
    margin +
    Math.random() *
    (window.innerWidth -
    margin * 2);

  const y =
    150 +
    Math.random() *
    (window.innerHeight -
    220);

  button.style.left =
    x + "px";

  button.style.top =
    y + "px";

}


/* -------------------------
   TRAPS
------------------------- */

function createTraps() {

  if (score < 10)
    return;

  let number = 0;

  if (
    score >= 10 &&
    score < 20
  ) {

    number =
      Math.random() < 0.25
        ? 1
        : 0;

  }

  else if (
    score >= 20 &&
    score < 30
  ) {

    number =
      Math.random() < 0.45
        ? 1
        : 0;

  }

  else if (
    score >= 30 &&
    score < 40
  ) {

    number =
      Math.random() < 0.6
        ? 2
        : 1;

  }

  else if (score >= 40) {

    number =
      Math.random() < 0.75
        ? 2
        : 3;

  }


  for (
    let i = 0;
    i < number;
    i++
  ) {

    createTrap();

  }

}


function createTrap() {

  const trap =
    document.createElement(
      "button"
    );

  trap.className =
    "trap";

  trap.textContent =
    "TAP";


  const margin = 70;

  const x =
    margin +
    Math.random() *
    (window.innerWidth -
    margin * 2);

  const y =
    150 +
    Math.random() *
    (window.innerHeight -
    220);

  trap.style.left =
    x + "px";

  trap.style.top =
    y + "px";


  trap.onclick =
    function() {

      if (gameRunning) {

        endGame();

      }

    };


  document
    .getElementById("game")
    .appendChild(trap);

  traps.push(trap);

}


function removeTraps() {

  traps.forEach(
    trap => trap.remove()
  );

  traps = [];

}


/* -------------------------
   RABBITS 🐇
------------------------- */

function createRabbits() {

  removeRabbits();


  let rabbitCount;

  if (currentLevel === 2) {

    rabbitCount = 1;

  }

  else if (currentLevel === 3) {

    rabbitCount = 2;

  }

  else if (currentLevel === 4) {

    rabbitCount = 2;

  }

  else if (currentLevel === 5) {

    rabbitCount = 3;

  }

  else {

    rabbitCount = 4;

  }


  for (
    let i = 0;
    i < rabbitCount;
    i++
  ) {

    createRabbit();

  }


  clearInterval(
    rabbitInterval
  );

  rabbitInterval =
    setInterval(
      animateRabbits,
      1200 - currentLevel * 100
    );

}


function createRabbit() {

  const rabbit =
    document.createElement(
      "div"
    );

  rabbit.className =
    "rabbit";

  rabbit.textContent =
    "🐇";


  rabbit.style.left =
    Math.random() *
    (window.innerWidth - 70) +
    "px";

  rabbit.style.top =
    160 +
    Math.random() *
    (window.innerHeight - 230) +
    "px";


  rabbit.onclick =
    function() {

      if (gameRunning) {

        endGame();

      }

    };


  document
    .getElementById("game")
    .appendChild(rabbit);

  rabbits.push(rabbit);

}


function animateRabbits() {

  if (!gameRunning)
    return;


  rabbits.forEach(
    rabbit => {

      rabbit.classList.remove(
        "jump"
      );

      void rabbit.offsetWidth;

      rabbit.classList.add(
        "jump"
      );

      rabbitSound();


      setTimeout(() => {

        if (!gameRunning)
          return;


        const x =
          Math.random() *
          (window.innerWidth - 70);

        const y =
          150 +
          Math.random() *
          (window.innerHeight - 220);


        rabbit.style.left =
          x + "px";

        rabbit.style.top =
          y + "px";

      }, 500);

    }
  );

}


function removeRabbits() {

  rabbits.forEach(
    rabbit => rabbit.remove()
  );

  rabbits = [];

}


/* -------------------------
   EFFECT
------------------------- */

function showTapEffect() {

  levelFlash.style.opacity =
    "0.08";

  setTimeout(() => {

    levelFlash.style.opacity =
      "0";

  }, 80);

}


/* -------------------------
   GAME OVER
------------------------- */

function endGame() {

  if (!gameRunning)
    return;

  gameRunning = false;

  clearInterval(
    timerInterval
  );

  clearInterval(
    rabbitInterval
  );

  button.style.display =
    "none";

  removeTraps();
  removeRabbits();


  let best =
    Number(
      localStorage.getItem(
        "dontTapBest"
      )
    ) || 0;


  if (score > best) {

    best = score;

    localStorage.setItem(
      "dontTapBest",
      best
    );

  }


  finalScore.textContent =
    "Score: " + score;

  bestScore.textContent =
    "Best Score: " + best;


  gameOverScreen.classList.remove(
    "hidden"
  );

}


button.addEventListener(
  "click",
  tapCorrectButton
);

</script>

</body>
</html>
