<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>DON'T TAP</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=DM+Serif+Display&display=swap');

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {

  background:
    radial-gradient(circle at 12% 18%, rgba(255,255,255,0.85) 0 2px, transparent 3px),
    radial-gradient(circle at 86% 28%, rgba(255,255,255,0.7) 0 2px, transparent 3px),
    linear-gradient(135deg, #fff9f5 0%, #f8eee8 52%, #f3e5e1 100%);

  background-size: 170px 170px, 230px 230px, 100% 100%;

  color: #5b4750;

  font-family:
    'Quicksand',
    Arial,
    Helvetica,
    sans-serif;

  user-select: none;

  -webkit-user-select: none;
}


#game {

  position: relative;

  width: 100vw;

  height: 100vh;

  overflow: hidden;

}


/* =========================
   HUD
========================= */

#score {

  position: absolute;

  top: 22px;

  width: 100%;

  text-align: center;

  font-size: 25px;

  font-weight: bold;

  z-index: 10;

}


#timer {

  position: absolute;

  top: 57px;

  width: 100%;

  text-align: center;

  font-size: 15px;

  color: #9a7b87;

  z-index: 10;

}


#level {

  position: absolute;

  top: 82px;

  width: 100%;

  text-align: center;

  font-size: 12px;

  color: #b85c7a;

  letter-spacing: 1px;

  z-index: 10;

}


#combo {

  position: absolute;

  top: 108px;

  width: 100%;

  text-align: center;

  font-size: 16px;

  font-weight: bold;

  color: #d06f96;

  opacity: 0;

  z-index: 10;

  transition: opacity 0.2s;

}


#warning {

  position: absolute;

  top: 135px;

  width: 100%;

  text-align: center;

  font-size: 11px;

  color: #b85c7a;

  opacity: 0;

  z-index: 10;

}


/* =========================
   COZY ATMOSPHERE
========================= */

#game::before,
#game::after {
  content: "";
  position: absolute;
  pointer-events: none;
  z-index: 0;
}

#game::before {
  inset: 0;
  background:
    radial-gradient(circle at 12% 82%, rgba(218,188,169,0.20), transparent 24%),
    radial-gradient(circle at 88% 80%, rgba(205,171,180,0.18), transparent 25%);
}

#game::after {
  width: 150px;
  height: 150px;
  right: -35px;
  bottom: -40px;
  border-radius: 50%;
  background: rgba(255,255,255,0.32);
  box-shadow:
    -120px 35px 0 -45px rgba(255,255,255,0.28),
    -210px -15px 0 -65px rgba(255,255,255,0.24);
}

#musicToggle {
  position: absolute;
  top: 18px;
  right: 18px;
  z-index: 30;
  border: 1px solid rgba(122,91,99,0.18);
  background: rgba(255,250,247,0.78);
  color: #765861;
  border-radius: 999px;
  padding: 8px 12px;
  font: 700 11px 'Quicksand', sans-serif;
  letter-spacing: 0.5px;
  cursor: pointer;
  backdrop-filter: blur(8px);
  box-shadow: 0 5px 18px rgba(100,70,70,0.08);
}

#musicToggle.off {
  opacity: 0.55;
}

/* =========================
   TAP BUTTON
========================= */

#tapButton {

  position: absolute;

  width: 120px;

  height: 120px;

  border: none;

  border-radius: 50%;

  background: #f3c1d4;

  color: #4a3440;

  font-size: 18px;

  font-weight: bold;

  cursor: pointer;

  transform:
    translate(-50%, -50%);

  z-index: 5;

  box-shadow:
    0 10px 30px
    rgba(184,92,122,0.18);

  transition:
    left 0.15s ease,
    top 0.15s ease,
    width 0.2s ease,
    height 0.2s ease,
    transform 0.1s ease;

}


#tapButton:active {

  transform:
    translate(-50%, -50%)
    scale(0.85);

}


/* =========================
   TRAPS
========================= */

.trap {

  position: absolute;

  width: 90px;

  height: 90px;

  border: none;

  border-radius: 50%;

  background: #d88fa8;

  color: white;

  font-size: 15px;

  font-weight: bold;

  cursor: pointer;

  transform:
    translate(-50%, -50%);

  z-index: 4;

  box-shadow:
    0 7px 20px
    rgba(184,92,122,0.16);

}


/* =========================
   RABBITS
========================= */

 .rabbit {

  position: absolute;

  width: 76px;

  height: 76px;

  object-fit: contain;

  z-index: 2;

  pointer-events: none;

  filter:
    drop-shadow(
      0 7px 10px
      rgba(104,76,76,0.18)
    );

}


/* =========================
   LEVEL FLASH
========================= */

#levelFlash {

  position: absolute;

  inset: 0;

  pointer-events: none;

  z-index: 15;

  opacity: 0;

  background:

    radial-gradient(
      circle at center,

      rgba(255,255,255,0.95),

      rgba(243,193,212,0.7),

      rgba(243,193,212,0)
    );

}


.flash {

  animation:
    flashAnimation
    0.8s ease-out;

}


@keyframes flashAnimation {

  0% {
    opacity: 0;
  }

  20% {
    opacity: 1;
  }

  45% {
    opacity: 0.75;
  }

  100% {
    opacity: 0;
  }

}


/* =========================
   LEVEL MESSAGE
========================= */

#levelMessage small {
  display: inline-block;
  margin-top: 8px;
  font-family: 'Quicksand', sans-serif;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.2px;
  color: #9a7b87;
}

#levelMessage {

  position: absolute;

  top: 42%;

  width: 100%;

  text-align: center;

  font-family: 'DM Serif Display', Georgia, serif;

  font-size: 34px;

  font-weight: 400;

  color: #8f6871;

  text-shadow: 0 2px 12px rgba(255,255,255,0.75);

  opacity: 0;

  z-index: 16;

  pointer-events: none;

}


.levelMessage {

  animation:
    levelMessageAnimation
    0.9s ease-out;

}


@keyframes levelMessageAnimation {

  0% {

    opacity: 0;

    transform:
      scale(0.7);

  }

  30% {

    opacity: 1;

    transform:
      scale(1.1);

  }

  70% {

    opacity: 1;

    transform:
      scale(1);

  }

  100% {

    opacity: 0;

    transform:
      scale(1.05);

  }

}


/* =========================
   START / GAME OVER
========================= */

.screen {

  position: absolute;

  inset: 0;

  background: #fff4f8;

  display: flex;

  flex-direction: column;

  justify-content: center;

  align-items: center;

  text-align: center;

  z-index: 20;

}


.hidden {

  display: none !important;

}


h1 {

  margin: 0 0 12px;

  font-family: 'DM Serif Display', Georgia, serif;

  font-size: 50px;

  font-weight: 400;

  letter-spacing: 2px;

  color: #76545e;

  text-shadow: 0 2px 0 rgba(255,255,255,0.6);

}


.subtitle {

  color: #9a7b87;

  margin-bottom: 30px;

}


.startButton {

  border: none;

  padding:
    15px 36px;

  border-radius: 30px;

  background: #e9a9c2;

  color: #4a3440;

  font-size: 17px;

  font-weight: bold;

  cursor: pointer;

  box-shadow:
    0 7px 20px
    rgba(184,92,122,0.15);

}


.startButton:active {

  transform:
    scale(0.95);

}


#finalScore {

  margin-bottom: 8px;

}


#bestScore {

  color: #9a7b87;

  margin-bottom: 28px;

}

@media (max-width: 600px) {

  #score {
    top: 18px;
    font-size: 22px;
  }

  #timer { top: 49px; }
  #level { top: 72px; }
  #combo { top: 96px; }
  #warning { top: 122px; }

  #musicToggle {
    top: 14px;
    right: 10px;
    padding: 7px 10px;
    font-size: 10px;
  }

  #levelMessage {
    top: 40%;
    padding: 0 20px;
    font-size: 30px;
  }

  .rabbit {
    width: 64px;
    height: 64px;
  }

  h1 {
    font-size: 42px;
  }

}

</style>

</head>


<body>


<div id="game">\n\n  <button id="musicToggle" type="button" aria-label="Toggle music">♪ MUSIC ON</button>


  <div id="score">
    Score: 0
  </div>


  <div id="timer">
    3.0
  </div>


  <div id="level">
    LEVEL 1
  </div>


  <div id="combo">
    COMBO x0
  </div>


  <div id="warning">
    BE CAREFUL...
  </div>


  <div id="levelFlash"></div>


  <div id="levelMessage">
    LEVEL UP!
  </div>


  <button id="tapButton">
    TAP
  </button>


  <div
    id="startScreen"
    class="screen"
  >

    <h1>
      DON'T TAP
    </h1>

    <div class="subtitle">

      How long can you survive?

    </div>

    <button
      class="startButton"
      id="startButton"
    >

      START

    </button>

  </div>


  <div
    id="gameOverScreen"
    class="screen hidden"
  >

    <h1>
      GAME OVER
    </h1>

    <div id="finalScore">
      Score: 0
    </div>

    <div id="bestScore">
      Best Score: 0
    </div>

    <button
      class="startButton"
      id="playAgainButton"
    >

      PLAY AGAIN

    </button>

  </div>


</div>


<script>

/* =========================
   GAME VARIABLES
========================= */

let score = 0;

let timeLeft = 3;

let combo = 0;

let currentLevel = 1;

let gameRunning = false;

let timerInterval;

let rabbitTimer;

let traps = [];

let rabbits = [];


/* =========================
   AUDIO
========================= */

let audioContext = null;
let musicEnabled = true;
let musicTimer = null;
let musicStep = 0;


function initAudio() {

  if (!audioContext) {

    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

  }

  if (
    audioContext.state ===
    "suspended"
  ) {

    audioContext.resume();

  }

}


function sound(
  frequency,
  duration,
  type = "sine",
  volume = 0.07
) {

  initAudio();

  const oscillator =
    audioContext.createOscillator();

  const gain =
    audioContext.createGain();


  oscillator.type = type;

  oscillator.frequency.value =
    frequency;


  gain.gain.setValueAtTime(
    volume,
    audioContext.currentTime
  );


  gain.gain.exponentialRampToValueAtTime(
    0.001,

    audioContext.currentTime +
    duration
  );


  oscillator.connect(gain);

  gain.connect(
    audioContext.destination
  );


  oscillator.start();

  oscillator.stop(
    audioContext.currentTime +
    duration
  );

}


/* COZY BACKGROUND MUSIC */

const cozyMelody = [
  261.63, 329.63, 392.00, 329.63,
  293.66, 349.23, 440.00, 349.23,
  261.63, 329.63, 392.00, 523.25,
  392.00, 349.23, 293.66, 261.63
];

function playMusicNote() {

  if (!musicEnabled || !audioContext || !gameRunning)
    return;

  const osc = audioContext.createOscillator();
  const gain = audioContext.createGain();

  osc.type = "sine";
  osc.frequency.value =
    cozyMelody[musicStep % cozyMelody.length];

  const now = audioContext.currentTime;

  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(0.018, now + 0.04);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.72);

  osc.connect(gain);
  gain.connect(audioContext.destination);

  osc.start(now);
  osc.stop(now + 0.75);

  musicStep++;
}

function startMusic() {

  if (!musicEnabled)
    return;

  initAudio();

  clearInterval(musicTimer);

  musicStep = 0;

  playMusicNote();

  musicTimer =
    setInterval(
      playMusicNote,
      760
    );

}

function stopMusic() {

  clearInterval(musicTimer);

  musicTimer = null;

}

function toggleMusic() {

  musicEnabled = !musicEnabled;

  musicToggle.textContent =
    musicEnabled
      ? "♪ MUSIC ON"
      : "♪ MUSIC OFF";

  musicToggle.classList.toggle(
    "off",
    !musicEnabled
  );

  if (
    musicEnabled &&
    gameRunning
  ) {

    startMusic();

  } else {

    stopMusic();

  }

}

/* TAP SOUND */

function tapSound() {

  sound(
    650,
    0.06,
    "sine",
    0.08
  );

}


/* COMBO SOUND */

function comboSound() {

  sound(
    700 + combo * 25,
    0.07,
    "triangle",
    0.07
  );

}


/* LEVEL SOUND */

function levelSound() {

  sound(
    523,
    0.12,
    "sine",
    0.08
  );

  setTimeout(() => {

    sound(
      659,
      0.12,
      "sine",
      0.08
    );

  }, 110);


  setTimeout(() => {

    sound(
      784,
      0.2,
      "sine",
      0.09
    );

  }, 220);

}


/* RABBIT SOUND */

function rabbitSound() {

  sound(
    280,
    0.07,
    "triangle",
    0.04
  );

  setTimeout(() => {

    sound(
      420,
      0.09,
      "triangle",
      0.035
    );

  }, 50);

}


/* =========================
   ELEMENTS
========================= */

const button =
  document.getElementById(
    "tapButton"
  );


const scoreText =
  document.getElementById(
    "score"
  );


const timerText =
  document.getElementById(
    "timer"
  );


const levelText =
  document.getElementById(
    "level"
  );


const comboText =
  document.getElementById(
    "combo"
  );


const warning =
  document.getElementById(
    "warning"
  );


const levelFlash =
  document.getElementById(
    "levelFlash"
  );


const levelMessage =
  document.getElementById(
    "levelMessage"
  );


const startScreen =
  document.getElementById(
    "startScreen"
  );


const gameOverScreen =
  document.getElementById(
    "gameOverScreen"
  );


const finalScore =
  document.getElementById(
    "finalScore"
  );


const bestScore =
  document.getElementById(
    "bestScore"
  );


const startButton =
  document.getElementById(
    "startButton"
  );


const playAgainButton =
  document.getElementById(
    "playAgainButton"
  );

const musicToggle =
  document.getElementById(
    "musicToggle"
  );


button.style.display =
  "none";


/* =========================
   START GAME
========================= */

function startGame() {

  initAudio();

  startMusic();

  score = 0;

  combo = 0;

  timeLeft = 3;

  currentLevel = 1;

  gameRunning = true;


  clearInterval(
    timerInterval
  );

  clearTimeout(
    rabbitTimer
  );


  removeTraps();

  removeRabbits();


  scoreText.textContent =
    "Score: 0";


  timerText.textContent =
    "3.0";


  levelText.textContent =
    "LEVEL 1";


  comboText.textContent =
    "COMBO x0";


  comboText.style.opacity =
    "0";


  warning.style.opacity =
    "0";


  startScreen.classList.add(
    "hidden"
  );


  gameOverScreen.classList.add(
    "hidden"
  );


  button.style.display =
    "block";


  button.style.width =
    "120px";


  button.style.height =
    "120px";


  moveButton();


  timerInterval =
    setInterval(
      updateTimer,
      100
    );

}


/* =========================
   TIMER
========================= */

function updateTimer() {

  timeLeft -= 0.1;


  timerText.textContent =
    timeLeft.toFixed(1);


  if (
    timeLeft <= 0
  ) {

    combo = 0;

    endGame();

  }

}


/* =========================
   TAP
========================= */

function tapCorrectButton() {

  if (!gameRunning)
    return;


  score++;

  combo++;


  scoreText.textContent =
    "Score: " + score;


  comboText.textContent =
    "COMBO x" + combo;


  comboText.style.opacity =
    "1";


  tapSound();


  if (
    combo >= 3
  ) {

    comboSound();

  }


  updateDifficulty();


  createTraps();


  moveButton();


  /* COMBO BONUS */

  if (
    combo >= 3
  ) {

    timeLeft += 0.12;

  }

}


/* =========================
   DIFFICULTY
========================= */

function updateDifficulty() {

  let newLevel;

  let size;


  if (
    score < 10
  ) {

    timeLeft = 3;

    size = 120;

    newLevel = 1;

  }

  else if (
    score < 20
  ) {

    timeLeft =
      Math.min(
        timeLeft,
        2.3
      );

    size = 105;

    newLevel = 2;

  }

  else if (
    score < 30
  ) {

    timeLeft =
      Math.min(
        timeLeft,
        1.8
      );

    size = 92;

    newLevel = 3;

  }

  else if (
    score < 40
  ) {

    timeLeft =
      Math.min(
        timeLeft,
        1.3
      );

    size = 78;

    newLevel = 4;

  }

  else if (
    score < 60
  ) {

    timeLeft =
      Math.min(
        timeLeft,
        1.0
      );

    size = 68;

    newLevel = 5;

  }

  else {

    timeLeft =
      Math.min(
        timeLeft,
        0.75
      );

    size = 58;

    newLevel = 6;

  }


  button.style.width =
    size + "px";


  button.style.height =
    size + "px";


  if (
    newLevel !==
    currentLevel
  ) {

    currentLevel =
      newLevel;


    levelText.textContent =
      "LEVEL " +
      currentLevel;


    levelUp();

  }


  if (
    score >= 20
  ) {

    warning.style.opacity =
      "1";

  }

}


/* =========================
   LEVEL UP
========================= */

function levelUp() {

  levelSound();

  const messages = {
    2: "Lovely! Keep going.",
    3: "Wonderful! You're getting good.",
    4: "Amazing! Stay focused.",
    5: "Impressive! Don't get comfy.",
    6: "Incredible! You're on fire."
  };

  levelFlash.classList.remove(
    "flash"
  );

  levelMessage.classList.remove(
    "levelMessage"
  );

  void levelFlash.offsetWidth;

  levelFlash.classList.add(
    "flash"
  );

  levelMessage.innerHTML =
    "<strong>LEVEL " +
    currentLevel +
    "</strong><br><small>" +
    (
      messages[currentLevel] ||
      "You're still going. Incredible!"
    ) +
    "</small>";

  levelMessage.classList.add(
    "levelMessage"
  );

  if (
    currentLevel >= 2
  ) {

    startRabbitWave();

  }

}


/* =========================
   TAP MOVEMENT
========================= */

function moveButton() {

  const margin = 75;


  const x =
    margin +
    Math.random() *
    (
      window.innerWidth -
      margin * 2
    );


  const y =
    165 +
    Math.random() *
    (
      window.innerHeight -
      235
    );


  button.style.left =
    x + "px";


  button.style.top =
    y + "px";

}


/* =========================
   TRAPS
========================= */

function createTraps() {

  if (
    score < 10
  )
    return;


  let amount = 0;


  if (
    score < 20
  ) {

    amount =
      Math.random() <
      0.25
        ? 1
        : 0;

  }

  else if (
    score < 30
  ) {

    amount =
      Math.random() <
      0.4
        ? 1
        : 0;

  }

  else if (
    score < 40
  ) {

    amount =
      Math.random() <
      0.55
        ? 1
        : 0;

  }

  else {

    amount =
      Math.random() <
      0.7
        ? 2
        : 1;

  }


  for (
    let i = 0;
    i < amount;
    i++
  ) {

    createTrap();

  }

}


function createTrap() {

  const trap = document.createElement("button");

  trap.className = "trap";
  trap.textContent = "TAP";

  const margin = 90;

  let x;
  let y;

  let safe = false;

  /*
    Tuzak gerçek TAP'a
    çok yaklaşmayacak.
  */

  while (!safe) {

    x =
      margin +
      Math.random() *
      (window.innerWidth - margin * 2);

    y =
      170 +
      Math.random() *
      (window.innerHeight - 260);

    const tapX =
      parseFloat(button.style.left);

    const tapY =
      parseFloat(button.style.top);

    const distance =
      Math.hypot(
        x - tapX,
        y - tapY
      );

    safe =
      distance > 180;

  }

  trap.style.left =
    x + "px";

  trap.style.top =
    y + "px";

  trap.addEventListener(
    "click",
    function(event) {

      event.stopPropagation();

      if (gameRunning) {
        endGame();
      }

    }
  );

  document
    .getElementById("game")
    .appendChild(trap);

  traps.push(trap);
}


function removeTraps() {

  traps.forEach(
    trap =>
      trap.remove()
  );


  traps = [];

}


/* =========================
   RABBITS
========================= */

function startRabbitWave() {

  clearTimeout(
    rabbitTimer
  );


  let count;


  if (
    currentLevel === 2
  ) {

    count = 1;

  }

  else if (
    currentLevel === 3
  ) {

    count = 2;

  }

  else if (
    currentLevel === 4
  ) {

    count = 2;

  }

  else if (
    currentLevel === 5
  ) {

    count = 3;

  }

  else {

    count = 4;

  }


  for (
    let i = 0;
    i < count;
    i++
  ) {

    setTimeout(
      () => {

        if (
          gameRunning
        ) {

          createRabbit();

        }

      },

      i * 700
    );

  }


  rabbitTimer =
    setTimeout(
      () => {

        if (
          gameRunning
        ) {

          startRabbitWave();

        }

      },

      Math.max(
        2500,
        5000 -
        currentLevel * 400
      )
    );

}


function createRabbit() {

  const rabbit =
    document.createElement(
      "img"
    );

  rabbit.className =
    "rabbit";

  rabbit.alt = "Rabbit";
  rabbit.draggable = false;
  rabbit.src = "assets/rabbit.png";

  rabbit.addEventListener(
    "error",
    () => rabbit.remove(),
    { once: true }
  );

  const y =
    170 +
    Math.random() *
    (
      window.innerHeight -
      260
    );

  rabbit.style.top =
    y + "px";

  rabbit.style.left =
    (
      window.innerWidth +
      80
    ) + "px";

  document
    .getElementById("game")
    .appendChild(
      rabbit
    );

  rabbits.push(
    rabbit
  );

  rabbitSound();

  const speed =
    Math.max(
      1800,
      4300 -
      currentLevel * 400
    );

  const animation =
    rabbit.animate(

      [

        {
          transform:
            "translateX(0) translateY(0) rotate(-5deg)"
        },

        {
          transform:
            "translateX(-25vw) translateY(-60px) rotate(5deg)"
        },

        {
          transform:
            "translateX(-50vw) translateY(0) rotate(-5deg)"
        },

        {
          transform:
            "translateX(-75vw) translateY(-60px) rotate(5deg)"
        },

        {
          transform:
            "translateX(-110vw) translateY(0) rotate(-5deg)"
        }

      ],

      {

        duration:
          speed,

        easing:
          "linear",

        fill:
          "forwards"

      }

    );

  animation.onfinish =
    () => {

      rabbit.remove();

      rabbits =
        rabbits.filter(
          r =>
            r !== rabbit
        );

    };

}


function removeRabbits() {

  rabbits.forEach(
    rabbit =>
      rabbit.remove()
  );


  rabbits = [];

}


/* =========================
   GAME OVER
========================= */

function endGame() {

  if (
    !gameRunning
  )
    return;

  stopMusic();


  gameRunning =
    false;


  clearInterval(
    timerInterval
  );


  clearTimeout(
    rabbitTimer
  );


  button.style.display =
    "none";


  removeTraps();

  removeRabbits();


  let best =
    Number(
      localStorage.getItem(
        "dontTapBest"
      )
    ) || 0;


  if (
    score > best
  ) {

    best = score;


    localStorage.setItem(
      "dontTapBest",
      best
    );

  }


  finalScore.textContent =
    "Score: " +
    score;


  bestScore.textContent =
    "Best Score: " +
    best;


  gameOverScreen.classList.remove(
    "hidden"
  );

}


/* =========================
   BUTTONS
========================= */

button.addEventListener(
  "click",

  function(event) {

    event.stopPropagation();

    tapCorrectButton();

  }

);


startButton.addEventListener(
  "click",
  startGame
);


playAgainButton.addEventListener(
  "click",
  startGame
);

musicToggle.addEventListener(
  "click",
  toggleMusic
);

</script>
