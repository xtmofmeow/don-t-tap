<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>DON'T TAP</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {

  background: #fff4f8;

  color: #4a3440;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  user-select: none;

  -webkit-user-select: none;
}


#game {

  position: relative;

  width: 100vw;

  height: 100vh;

  overflow: hidden;

}


/* =========================
   HUD
========================= */

#score {

  position: absolute;

  top: 22px;

  width: 100%;

  text-align: center;

  font-size: 25px;

  font-weight: bold;

  z-index: 10;

}


#timer {

  position: absolute;

  top: 57px;

  width: 100%;

  text-align: center;

  font-size: 15px;

  color: #9a7b87;

  z-index: 10;

}


#level {

  position: absolute;

  top: 82px;

  width: 100%;

  text-align: center;

  font-size: 12px;

  color: #b85c7a;

  letter-spacing: 1px;

  z-index: 10;

}


#combo {

  position: absolute;

  top: 108px;

  width: 100%;

  text-align: center;

  font-size: 16px;

  font-weight: bold;

  color: #d06f96;

  opacity: 0;

  z-index: 10;

  transition: opacity 0.2s;

}


#warning {

  position: absolute;

  top: 135px;

  width: 100%;

  text-align: center;

  font-size: 11px;

  color: #b85c7a;

  opacity: 0;

  z-index: 10;

}


/* =========================
   TAP BUTTON
========================= */

#tapButton {

  position: absolute;

  width: 120px;

  height: 120px;

  border: none;

  border-radius: 50%;

  background: #f3c1d4;

  color: #4a3440;

  font-size: 18px;

  font-weight: bold;

  cursor: pointer;

  transform:
    translate(-50%, -50%);

  z-index: 5;

  box-shadow:
    0 10px 30px
    rgba(184,92,122,0.18);

  transition:
    left 0.15s ease,
    top 0.15s ease,
    width 0.2s ease,
    height 0.2s ease,
    transform 0.1s ease;

}


#tapButton:active {

  transform:
    translate(-50%, -50%)
    scale(0.85);

}


/* =========================
   TRAPS
========================= */

.trap {

  position: absolute;

  width: 90px;

  height: 90px;

  border: none;

  border-radius: 50%;

  background: #d88fa8;

  color: white;

  font-size: 15px;

  font-weight: bold;

  cursor: pointer;

  transform:
    translate(-50%, -50%);

  z-index: 4;

  box-shadow:
    0 7px 20px
    rgba(184,92,122,0.16);

}


/* =========================
   RABBITS
========================= */

.rabbit {

  position: absolute;

  width: 60px;

  height: 60px;

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 48px;

  z-index: 2;

  pointer-events: none;

  filter:
    drop-shadow(
      0 6px 8px
      rgba(184,92,122,0.16)
    );

}


/* =========================
   LEVEL FLASH
========================= */

#levelFlash {

  position: absolute;

  inset: 0;

  pointer-events: none;

  z-index: 15;

  opacity: 0;

  background:

    radial-gradient(
      circle at center,

      rgba(255,255,255,0.95),

      rgba(243,193,212,0.7),

      rgba(243,193,212,0)
    );

}


.flash {

  animation:
    flashAnimation
    0.8s ease-out;

}


@keyframes flashAnimation {

  0% {
    opacity: 0;
  }

  20% {
    opacity: 1;
  }

  45% {
    opacity: 0.75;
  }

  100% {
    opacity: 0;
  }

}


/* =========================
   LEVEL MESSAGE
========================= */

#levelMessage {

  position: absolute;

  top: 42%;

  width: 100%;

  text-align: center;

  font-size: 34px;

  font-weight: bold;

  color: #b85c7a;

  opacity: 0;

  z-index: 16;

  pointer-events: none;

}


.levelMessage {

  animation:
    levelMessageAnimation
    0.9s ease-out;

}


@keyframes levelMessageAnimation {

  0% {

    opacity: 0;

    transform:
      scale(0.7);

  }

  30% {

    opacity: 1;

    transform:
      scale(1.1);

  }

  70% {

    opacity: 1;

    transform:
      scale(1);

  }

  100% {

    opacity: 0;

    transform:
      scale(1.05);

  }

}


/* =========================
   START / GAME OVER
========================= */

.screen {

  position: absolute;

  inset: 0;

  background: #fff4f8;

  display: flex;

  flex-direction: column;

  justify-content: center;

  align-items: center;

  text-align: center;

  z-index: 20;

}


.hidden {

  display: none !important;

}


h1 {

  margin: 0 0 12px;

  font-size: 48px;

  letter-spacing: 3px;

}


.subtitle {

  color: #9a7b87;

  margin-bottom: 30px;

}


.startButton {

  border: none;

  padding:
    15px 36px;

  border-radius: 30px;

  background: #e9a9c2;

  color: #4a3440;

  font-size: 17px;

  font-weight: bold;

  cursor: pointer;

  box-shadow:
    0 7px 20px
    rgba(184,92,122,0.15);

}


.startButton:active {

  transform:
    scale(0.95);

}


#finalScore {

  margin-bottom: 8px;

}


#bestScore {

  color: #9a7b87;

  margin-bottom: 28px;

}

</style>

</head>


<body>


<div id="game">


  <div id="score">
    Score: 0
  </div>


  <div id="timer">
    3.0
  </div>


  <div id="level">
    LEVEL 1
  </div>


  <div id="combo">
    COMBO x0
  </div>


  <div id="warning">
    BE CAREFUL...
  </div>


  <div id="levelFlash"></div>


  <div id="levelMessage">
    LEVEL UP!
  </div>


  <button id="tapButton">
    TAP
  </button>


  <div
    id="startScreen"
    class="screen"
  >

    <h1>
      DON'T TAP
    </h1>

    <div class="subtitle">

      How long can you survive?

    </div>

    <button
      class="startButton"
      id="startButton"
    >

      START

    </button>

  </div>


  <div
    id="gameOverScreen"
    class="screen hidden"
  >

    <h1>
      GAME OVER
    </h1>

    <div id="finalScore">
      Score: 0
    </div>

    <div id="bestScore">
      Best Score: 0
    </div>

    <button
      class="startButton"
      id="playAgainButton"
    >

      PLAY AGAIN

    </button>

  </div>


</div>


<script>

/* =========================
   GAME VARIABLES
========================= */

let score = 0;

let timeLeft = 3;

let combo = 0;

let currentLevel = 1;

let gameRunning = false;

let timerInterval;

let rabbitTimer;

let traps = [];

let rabbits = [];


/* =========================
   AUDIO
========================= */

let audioContext = null;


function initAudio() {

  if (!audioContext) {

    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

  }

  if (
    audioContext.state ===
    "suspended"
  ) {

    audioContext.resume();

  }

}


function sound(
  frequency,
  duration,
  type = "sine",
  volume = 0.07
) {

  initAudio();

  const oscillator =
    audioContext.createOscillator();

  const gain =
    audioContext.createGain();


  oscillator.type = type;

  oscillator.frequency.value =
    frequency;


  gain.gain.setValueAtTime(
    volume,
    audioContext.currentTime
  );


  gain.gain.exponentialRampToValueAtTime(
    0.001,

    audioContext.currentTime +
    duration
  );


  oscillator.connect(gain);

  gain.connect(
    audioContext.destination
  );


  oscillator.start();

  oscillator.stop(
    audioContext.currentTime +
    duration
  );

}


/* TAP SOUND */

function tapSound() {

  sound(
    650,
    0.06,
    "sine",
    0.08
  );

}


/* COMBO SOUND */

function comboSound() {

  sound(
    700 + combo * 25,
    0.07,
    "triangle",
    0.07
  );

}


/* LEVEL SOUND */

function levelSound() {

  sound(
    523,
    0.12,
    "sine",
    0.08
  );

  setTimeout(() => {

    sound(
      659,
      0.12,
      "sine",
      0.08
    );

  }, 110);


  setTimeout(() => {

    sound(
      784,
      0.2,
      "sine",
      0.09
    );

  }, 220);

}


/* RABBIT SOUND */

function rabbitSound() {

  sound(
    280,
    0.07,
    "triangle",
    0.04
  );

  setTimeout(() => {

    sound(
      420,
      0.09,
      "triangle",
      0.035
    );

  }, 50);

}


/* =========================
   ELEMENTS
========================= */

const button =
  document.getElementById(
    "tapButton"
  );


const scoreText =
  document.getElementById(
    "score"
  );


const timerText =
  document.getElementById(
    "timer"
  );


const levelText =
  document.getElementById(
    "level"
  );


const comboText =
  document.getElementById(
    "combo"
  );


const warning =
  document.getElementById(
    "warning"
  );


const levelFlash =
  document.getElementById(
    "levelFlash"
  );


const levelMessage =
  document.getElementById(
    "levelMessage"
  );


const startScreen =
  document.getElementById(
    "startScreen"
  );


const gameOverScreen =
  document.getElementById(
    "gameOverScreen"
  );


const finalScore =
  document.getElementById(
    "finalScore"
  );


const bestScore =
  document.getElementById(
    "bestScore"
  );


const startButton =
  document.getElementById(
    "startButton"
  );


const playAgainButton =
  document.getElementById(
    "playAgainButton"
  );


button.style.display =
  "none";


/* =========================
   START GAME
========================= */

function startGame() {

  initAudio();

  score = 0;

  combo = 0;

  timeLeft = 3;

  currentLevel = 1;

  gameRunning = true;


  clearInterval(
    timerInterval
  );

  clearTimeout(
    rabbitTimer
  );


  removeTraps();

  removeRabbits();


  scoreText.textContent =
    "Score: 0";


  timerText.textContent =
    "3.0";


  levelText.textContent =
    "LEVEL 1";


  comboText.textContent =
    "COMBO x0";


  comboText.style.opacity =
    "0";


  warning.style.opacity =
    "0";


  startScreen.classList.add(
    "hidden"
  );


  gameOverScreen.classList.add(
    "hidden"
  );


  button.style.display =
    "block";


  button.style.width =
    "120px";


  button.style.height =
    "120px";


  moveButton();


  timerInterval =
    setInterval(
      updateTimer,
      100
    );

}


/* =========================
   TIMER
========================= */

function updateTimer() {

  timeLeft -= 0.1;


  timerText.textContent =
    timeLeft.toFixed(1);


  if (
    timeLeft <= 0
  ) {

    combo = 0;

    endGame();

  }

}


/* =========================
   TAP
========================= */

function tapCorrectButton() {

  if (!gameRunning)
    return;


  score++;

  combo++;


  scoreText.textContent =
    "Score: " + score;


  comboText.textContent =
    "COMBO x" + combo;


  comboText.style.opacity =
    "1";


  tapSound();


  if (
    combo >= 3
  ) {

    comboSound();

  }


  updateDifficulty();


  createTraps();


  moveButton();


  /* COMBO BONUS */

  if (
    combo >= 3
  ) {

    timeLeft += 0.12;

  }

}


/* =========================
   DIFFICULTY
========================= */

function updateDifficulty() {

  let newLevel;

  let size;


  if (
    score < 10
  ) {

    timeLeft = 3;

    size = 120;

    newLevel = 1;

  }

  else if (
    score < 20
  ) {

    timeLeft =
      Math.min(
        timeLeft,
        2.3
      );

    size = 105;

    newLevel = 2;

  }

  else if (
    score < 30
  ) {

    timeLeft =
      Math.min(
        timeLeft,
        1.8
      );

    size = 92;

    newLevel = 3;

  }

  else if (
    score < 40
  ) {

    timeLeft =
      Math.min(
        timeLeft,
        1.3
      );

    size = 78;

    newLevel = 4;

  }

  else if (
    score < 60
  ) {

    timeLeft =
      Math.min(
        timeLeft,
        1.0
      );

    size = 68;

    newLevel = 5;

  }

  else {

    timeLeft =
      Math.min(
        timeLeft,
        0.75
      );

    size = 58;

    newLevel = 6;

  }


  button.style.width =
    size + "px";


  button.style.height =
    size + "px";


  if (
    newLevel !==
    currentLevel
  ) {

    currentLevel =
      newLevel;


    levelText.textContent =
      "LEVEL " +
      currentLevel;


    levelUp();

  }


  if (
    score >= 20
  ) {

    warning.style.opacity =
      "1";

  }

}


/* =========================
   LEVEL UP
========================= */

function levelUp() {

  levelSound();


  levelFlash.classList.remove(
    "flash"
  );


  levelMessage.classList.remove(
    "levelMessage"
  );


  void levelFlash.offsetWidth;


  levelFlash.classList.add(
    "flash"
  );


  levelMessage.textContent =
    "LEVEL " +
    currentLevel;


  levelMessage.classList.add(
    "levelMessage"
  );


  if (
    currentLevel >= 2
  ) {

    startRabbitWave();

  }

}


/* =========================
   TAP MOVEMENT
========================= */

function moveButton() {

  const margin = 75;


  const x =
    margin +
    Math.random() *
    (
      window.innerWidth -
      margin * 2
    );


  const y =
    165 +
    Math.random() *
    (
      window.innerHeight -
      235
    );


  button.style.left =
    x + "px";


  button.style.top =
    y + "px";

}


/* =========================
   TRAPS
========================= */

function createTraps() {

  if (
    score < 10
  )
    return;


  let amount = 0;


  if (
    score < 20
  ) {

    amount =
      Math.random() <
      0.25
        ? 1
        : 0;

  }

  else if (
    score < 30
  ) {

    amount =
      Math.random() <
      0.4
        ? 1
        : 0;

  }

  else if (
    score < 40
  ) {

    amount =
      Math.random() <
      0.55
        ? 1
        : 0;

  }

  else {

    amount =
      Math.random() <
      0.7
        ? 2
        : 1;

  }


  for (
    let i = 0;
    i < amount;
    i++
  ) {

    createTrap();

  }

}


function createTrap() {

  const trap = document.createElement("button");

  trap.className = "trap";
  trap.textContent = "TAP";

  const margin = 90;

  let x;
  let y;

  let safe = false;

  /*
    Tuzak gerçek TAP'a
    çok yaklaşmayacak.
  */

  while (!safe) {

    x =
      margin +
      Math.random() *
      (window.innerWidth - margin * 2);

    y =
      170 +
      Math.random() *
      (window.innerHeight - 260);

    const tapX =
      parseFloat(button.style.left);

    const tapY =
      parseFloat(button.style.top);

    const distance =
      Math.hypot(
        x - tapX,
        y - tapY
      );

    safe =
      distance > 180;

  }

  trap.style.left =
    x + "px";

  trap.style.top =
    y + "px";

  trap.addEventListener(
    "click",
    function(event) {

      event.stopPropagation();

      if (gameRunning) {
        endGame();
      }

    }
  );

  document
    .getElementById("game")
    .appendChild(trap);

  traps.push(trap);
}


function removeTraps() {

  traps.forEach(
    trap =>
      trap.remove()
  );


  traps = [];

}


/* =========================
   RABBITS
========================= */

function startRabbitWave() {

  clearTimeout(
    rabbitTimer
  );


  let count;


  if (
    currentLevel === 2
  ) {

    count = 1;

  }

  else if (
    currentLevel === 3
  ) {

    count = 2;

  }

  else if (
    currentLevel === 4
  ) {

    count = 2;

  }

  else if (
    currentLevel === 5
  ) {

    count = 3;

  }

  else {

    count = 4;

  }


  for (
    let i = 0;
    i < count;
    i++
  ) {

    setTimeout(
      () => {

        if (
          gameRunning
        ) {

          createRabbit();

        }

      },

      i * 700
    );

  }


  rabbitTimer =
    setTimeout(
      () => {

        if (
          gameRunning
        ) {

          startRabbitWave();

        }

      },

      Math.max(
        2500,
        5000 -
        currentLevel * 400
      )
    );

}


function createRabbit() {

  const rabbit =
    document.createElement(
      "div"
    );


  rabbit.className =
    "rabbit";


  rabbit.textContent =
    "🐇";


  const y =
    170 +
    Math.random() *
    (
      window.innerHeight -
      260
    );


  rabbit.style.top =
    y + "px";


  rabbit.style.left =
    (
      window.innerWidth +
      80
    ) + "px";


  document
    .getElementById("game")
    .appendChild(
      rabbit
    );


  rabbits.push(
    rabbit
  );


  rabbitSound();


  const speed =
    Math.max(
      1800,
      4300 -
      currentLevel * 400
    );


  const animation =
    rabbit.animate(

      [

        {
          transform:
            "translateX(0) translateY(0) rotate(-5deg)"
        },

        {
          transform:
            "translateX(-25vw) translateY(-60px) rotate(5deg)"
        },

        {
          transform:
            "translateX(-50vw) translateY(0) rotate(-5deg)"
        },

        {
          transform:
            "translateX(-75vw) translateY(-60px) rotate(5deg)"
        },

        {
          transform:
            "translateX(-110vw) translateY(0) rotate(-5deg)"
        }

      ],

      {

        duration:
          speed,

        easing:
          "linear",

        fill:
          "forwards"

      }

    );


  animation.onfinish =
    () => {

      rabbit.remove();


      rabbits =
        rabbits.filter(
          r =>
            r !== rabbit
        );

    };

}


function removeRabbits() {

  rabbits.forEach(
    rabbit =>
      rabbit.remove()
  );


  rabbits = [];

}


/* =========================
   GAME OVER
========================= */

function endGame() {

  if (
    !gameRunning
  )
    return;


  gameRunning =
    false;


  clearInterval(
    timerInterval
  );


  clearTimeout(
    rabbitTimer
  );


  button.style.display =
    "none";


  removeTraps();

  removeRabbits();


  let best =
    Number(
      localStorage.getItem(
        "dontTapBest"
      )
    ) || 0;


  if (
    score > best
  ) {

    best = score;


    localStorage.setItem(
      "dontTapBest",
      best
    );

  }


  finalScore.textContent =
    "Score: " +
    score;


  bestScore.textContent =
    "Best Score: " +
    best;


  gameOverScreen.classList.remove(
    "hidden"
  );

}


/* =========================
   BUTTONS
========================= */

button.addEventListener(
  "click",

  function(event) {

    event.stopPropagation();

    tapCorrectButton();

  }

);


startButton.addEventListener(
  "click",
  startGame
);


playAgainButton.addEventListener(
  "click",
  startGame
);

</script>

</body>

</html>
