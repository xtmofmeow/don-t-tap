<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DON'T TAP</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  overflow: hidden;
  background: #fff4f8;
  color: #4a3440;
  font-family: Arial, sans-serif;
  user-select: none;
  -webkit-user-select: none;
}

#game {
  width: 100vw;
  height: 100vh;
  position: relative;
}

#score {
  position: absolute;
  top: 24px;
  width: 100%;
  text-align: center;
  font-size: 24px;
  font-weight: bold;
  color: #4a3440;
  z-index: 10;
}

#timer {
  position: absolute;
  top: 58px;
  width: 100%;
  text-align: center;
  font-size: 15px;
  color: #9a7b87;
  z-index: 10;
}

#level {
  position: absolute;
  top: 82px;
  width: 100%;
  text-align: center;
  font-size: 12px;
  color: #b85c7a;
  z-index: 10;
}

#tapButton,
.trap {
  position: absolute;
  border: none;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  cursor: pointer;
  font-weight: bold;
}

#tapButton {
  width: 120px;
  height: 120px;
  background: #f3c1d4;
  color: #4a3440;
  font-size: 18px;
  box-shadow: 0 8px 25px rgba(184,92,122,0.18);
  z-index: 5;
  transition:
    left 0.15s ease,
    top 0.15s ease,
    width 0.2s ease,
    height 0.2s ease,
    transform 0.1s ease;
}

#tapButton:active {
  transform: translate(-50%, -50%) scale(0.88);
}

.trap {
  width: 90px;
  height: 90px;
  background: #d88fa8;
  color: white;
  font-size: 15px;
  z-index: 4;
  box-shadow: 0 6px 20px rgba(184,92,122,0.15);
}

.screen {
  position: absolute;
  inset: 0;
  background: #fff4f8;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  z-index: 20;
}

.hidden {
  display: none !important;
}

h1 {
  margin: 0 0 12px;
  font-size: 48px;
  letter-spacing: 3px;
  color: #4a3440;
}

.subtitle {
  color: #9a7b87;
  margin-bottom: 30px;
}

.startButton {
  border: none;
  padding: 15px 36px;
  border-radius: 30px;
  background: #e9a9c2;
  color: #4a3440;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 6px 18px rgba(184,92,122,0.15);
}

.startButton:active {
  transform: scale(0.95);
}

#bestScore {
  color: #9a7b87;
  margin-bottom: 28px;
}

#warning {
  position: absolute;
  top: 108px;
  width: 100%;
  text-align: center;
  color: #b85c7a;
  font-size: 12px;
  opacity: 0;
  transition: opacity 0.3s;
  z-index: 10;
}

#flash {
  position: absolute;
  inset: 0;
  background: #e9a9c2;
  opacity: 0;
  pointer-events: none;
  z-index: 15;
  transition: opacity 0.1s;
}

</style>
</head>

<body>

<div id="game">

  <div id="score">Score: 0</div>
  <div id="timer">3.0</div>
  <div id="level">LEVEL 1</div>
  <div id="warning">BE CAREFUL...</div>

  <div id="flash"></div>

  <button id="tapButton">TAP</button>

  <div id="startScreen" class="screen">

    <h1>DON'T TAP</h1>

    <div class="subtitle">
      Tap before time runs out.
    </div>

    <button class="startButton" onclick="startGame()">
      START
    </button>

  </div>

  <div id="gameOverScreen" class="screen hidden">

    <h1>GAME OVER</h1>

    <div id="finalScore"></div>

    <div id="bestScore"></div>

    <button class="startButton" onclick="startGame()">
      PLAY AGAIN
    </button>

  </div>

</div>

<script>

let score = 0;
let timeLeft = 3;
let timerInterval;
let gameRunning = false;
let traps = [];

const button = document.getElementById("tapButton");
const scoreText = document.getElementById("score");
const timerText = document.getElementById("timer");
const levelText = document.getElementById("level");
const warning = document.getElementById("warning");
const flash = document.getElementById("flash");

const startScreen = document.getElementById("startScreen");
const gameOverScreen = document.getElementById("gameOverScreen");

const finalScore = document.getElementById("finalScore");
const bestScore = document.getElementById("bestScore");

button.style.display = "none";


function startGame() {

  score = 0;
  timeLeft = 3;
  gameRunning = true;

  clearInterval(timerInterval);
  removeTraps();

  scoreText.textContent = "Score: 0";
  timerText.textContent = "3.0";
  levelText.textContent = "LEVEL 1";

  warning.style.opacity = "0";

  startScreen.classList.add("hidden");
  gameOverScreen.classList.add("hidden");

  button.style.display = "block";

  moveButton();

  timerInterval = setInterval(updateTimer, 100);
}


function updateTimer() {

  timeLeft -= 0.1;

  timerText.textContent = timeLeft.toFixed(1);

  if (timeLeft <= 0) {
    endGame();
  }
}


function tapCorrectButton() {

  if (!gameRunning) return;

  score++;

  scoreText.textContent = "Score: " + score;

  updateDifficulty();

  removeTraps();

  createTraps();

  moveButton();

  showTapEffect();
}


function updateDifficulty() {

  let size;
  let level;

  if (score < 10) {

    timeLeft = 3;
    size = 120;
    level = 1;

  } else if (score < 20) {

    timeLeft = 2.3;
    size = 105;
    level = 2;

  } else if (score < 30) {

    timeLeft = 1.8;
    size = 92;
    level = 3;

  } else if (score < 40) {

    timeLeft = 1.3;
    size = 78;
    level = 4;

  } else if (score < 60) {

    timeLeft = 1.0;
    size = 68;
    level = 5;

  } else {

    timeLeft = 0.75;
    size = 58;
    level = 6;

  }

  button.style.width = size + "px";
  button.style.height = size + "px";

  levelText.textContent = "LEVEL " + level;

  if (score >= 20) {
    warning.style.opacity = "1";
  }

}


function moveButton() {

  const margin = 70;

  const x =
    margin +
    Math.random() *
    (window.innerWidth - margin * 2);

  const y =
    150 +
    Math.random() *
    (window.innerHeight - 220);

  button.style.left = x + "px";
  button.style.top = y + "px";

}


function createTraps() {

  if (score < 10) return;

  let number = 0;

  if (score >= 10 && score < 20) {
    number = Math.random() < 0.25 ? 1 : 0;
  }

  else if (score >= 20 && score < 30) {
    number = Math.random() < 0.45 ? 1 : 0;
  }

  else if (score >= 30 && score < 40) {
    number = Math.random() < 0.6 ? 2 : 1;
  }

  else if (score >= 40) {
    number = Math.random() < 0.75 ? 2 : 3;
  }

  for (let i = 0; i < number; i++) {
    createTrap();
  }

}


function createTrap() {

  const trap = document.createElement("button");

  trap.className = "trap";
  trap.textContent = "TAP";

  const margin = 70;

  const x =
    margin +
    Math.random() *
    (window.innerWidth - margin * 2);

  const y =
    150 +
    Math.random() *
    (window.innerHeight - 220);

  trap.style.left = x + "px";
  trap.style.top = y + "px";

  trap.addEventListener("click", function() {

    if (gameRunning) {
      endGame();
    }

  });

  document.getElementById("game").appendChild(trap);

  traps.push(trap);

}


function removeTraps() {

  traps.forEach(trap => {
    trap.remove();
  });

  traps = [];

}


function showTapEffect() {

  flash.style.opacity = "0.18";

  setTimeout(() => {
    flash.style.opacity = "0";
  }, 100);

}


function endGame() {

  if (!gameRunning) return;

  gameRunning = false;

  clearInterval(timerInterval);

  button.style.display = "none";

  removeTraps();

  let best =
    Number(localStorage.getItem("dontTapBest")) || 0;

  if (score > best) {

    best = score;

    localStorage.setItem(
      "dontTapBest",
      best
    );

  }

  finalScore.textContent =
    "Score: " + score;

  bestScore.textContent =
    "Best Score: " + best;

  gameOverScreen.classList.remove("hidden");

}


button.addEventListener(
  "click",
  tapCorrectButton
);

</script>

</body>
</html>
